name: hirebuddy
version: 1.0.0
description: >
  One-sentence job agent for blind and low-vision job seekers in Malaysia. Checks every job for legal pay and
  access, applies, books interviews in their preferred format, emails each one time-first, and verifies its own work.
parameters:
  - name: prompt
    type: string
    required: true
    description: The user's request in their own words.
  - name: listings
    type: array
    required: false
    description: Jobs found on real job sites for a job seeker (title, employer, site, url, pay, location, hours, description), copied as written. HireBuddy checks each and drafts an application; nothing is sent.
entry: scripts/hirebuddy.js
instructions: SKILL.md
