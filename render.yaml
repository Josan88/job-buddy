services:
  - type: web
    name: hirebuddy
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: BREVO_API_KEY
        sync: false
      - key: DEMO_INBOX
        sync: false
      # Send hand-offs to WorkBuddy through Telegram (node workbuddy/telegram-login.js prints these).
      - key: WORKBUDDY_TELEGRAM_BOT
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_HANDOFF_KEY
        sync: false
